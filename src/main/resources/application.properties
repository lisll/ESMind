# =============================================================================
# ESMind — Application Configuration (v2 Compiler + Fallback + Rate Limit)
# =============================================================================

# Primary LLM Model (豆包 — 主模型，受 rate limit 保护)
esmind.model.base-url=https://ark.cn-beijing.volces.com/api/v3
esmind.model.api-key=${DASHSCOPE_API_KEY}
esmind.model.name=doubao-seed-2-0-code-250615

# Fallback LLM Model (DeepSeek — 主模型不可用时的备用，不受 rate limit 限制)
esmind.model.fallback.base-url=https://api.deepseek.com
esmind.model.fallback.api-key=${DEEPSEEK_API_KEY}
esmind.model.fallback.name=deepseek-chat

# Rate Limit: 每 5 分钟最多 50 次调用，防止豆包 5 小时配额提前耗尽
# 超出后自动切换到备用模型（DeepSeek）
esmind.ratelimit.max=50
esmind.ratelimit.window-ms=300000

# Elasticsearch Connection
esmind.es.host=192.168.8.156
esmind.es.port=9230
esmind.es.scheme=http
esmind.es.username=
esmind.es.password=

# Target ES Index
esmind.es.index=history2026_clinical_inhistory_0429122358

# Server
server.port=8090

# Schema Cache (saves ES mapping to local file on first load)
esmind.schema.cache-path=data/schema-cache.json
